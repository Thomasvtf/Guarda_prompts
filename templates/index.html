<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Document</title>
</head>

<body>
    <form method="POST" action="{{ url_for('guardar_prompt')}}">
        <h1 class="titulo">Administra tus prompts aquí</h1>
        <div class="contenedor_prompt">
            <label for="prompt">Escribe tu prompt</label>
            <textarea name="prompt" placeholder="Hazme una app con..." required></textarea>
            <button type="submit">Guardar</button>
        </div>
    </form>
    <h2 class="subtitulo">Tus prompts se mostraran aqui.</h2>
    <div class="prompt_card">
        <ul>
            {%for prompt in prompts %}
            <li>{{prompt[0]}}</li>

            {% endfor %}
        </ul>

    </div>
</body>

</html>
